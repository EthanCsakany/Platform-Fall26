<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello React!</title>
    <!-- import React libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>    
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.js"></script>
    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" 
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" 
    crossorigin="anonymous">
  </head>
  
  <body>
    <!-- The body of the html document has one div tag with the id root.
    This is where we'll place our HTML generated by the React library. -->

    <div id="root"></div>
    <script type="text/babel"> 
    
    function NavMenu() {
      return (
        <ul className="nav justify-content-end">
          <li className="nav-item"><a className="nav-link" href="index.html">Home</a></li>
          <li className="nav-item"><a className="nav-link" href="accessibility.html">Accessibility</a></li>
          <li className="nav-item"><a className="nav-link" href="javascript.html">JavaScript</a></li>
          <li className="nav-item"><a className="nav-link" href="react.html">React</a></li>
        </ul>
      );
    }

    function Boomer() {
        return (
            <div>
                <p>Hello, my name is Boomer</p>
                <img src="images/boomer.png" alt="Boomer" />
            </div>
        );
    }

    function Grumpy() {
        return (
            <div>
                <p>Hello, my name is Grumpy </p>
                <img src="images/grumpy.jpeg" alt="Grumpy" />
            </div>
        );
    }

    function Hello({name}) {
        return (
            <p> Hello, {name}! </p>
        );
    }

    function Pet({name, image}) {
        return (
            <div>
                <p>Hi! My name is {name}!</p>
                <img src={image} alt={name} />
            </div>
        );
    }

    function App() {
        return (
            <div className="row">
                <div className="col-md-6">
                    <p>Hi! My name is Boomer!</p>
                    <img className="img-fluid" src="images/boomer.png" alt="Boomer" />
                </div>
                <div className="col-md-6">
                    <p>Hi! My name is Grumpy!</p>
                    <img className="img-fluid" src="images/grumpy.jpeg" alt="Grumpy" />
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <div>
        <NavMenu />
        <h1>Hello World!</h1>
        <p>React creates dynamic elements</p>
        <Boomer />
        <Grumpy />
        <Hello name="Bob" />
        <Hello name="Jake" />
        <h3> <Pet name="Boomer" image="images/boomer.png" /> </h3>
        <h3> <Pet name="Grumpy" image="images/grumpy.jpeg" /> </h3>
        <h3> <App /> </h3>
        
      </div>
    );

   
   </script>    
  </body>
</html>
